  var viewer=document.getElementById('viewer'),frame=document.getElementById('frame');
  function open(v){frame.srcdoc=V[v];viewer.classList.add('on');document.querySelectorAll('.sw').forEach(function(b){b.classList.toggle('cur',b.dataset.v===v)});try{history.replaceState(null,'','#version-'+v)}catch(e){}}

  /* heartbeat trace: a calm rhythm for A, a busier one for B */
  var c=document.getElementById('ecg'),x=c.getContext('2d'),W=0,H=0,off=0,last=0,cur={sp:340,amp:.8},tgt={sp:340,amp:.8};
  var still=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  function size(){var d=Math.min(window.devicePixelRatio||1,2);W=c.clientWidth;H=c.clientHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);if(still)draw(0)}
  function g(u){return Math.exp(-u*u)}
  function beat(d){return .12*g((d+62)/11)-.12*g((d+11)/3)+g(d/3.4)-.26*g((d-10)/3.8)+.26*g((d-64)/17)}
  function y(px){var w=px+off,k=Math.round(w/cur.sp),s=0;for(var i=-1;i<=1;i++)s+=beat(w-(k+i)*cur.sp);return H*.6-s*H*.4*cur.amp}
  function draw(dt){
    off+=dt*.09;cur.sp+=(tgt.sp-cur.sp)*.05;cur.amp+=(tgt.amp-cur.amp)*.05;
    var cs=getComputedStyle(document.documentElement),head=W*.9;
    x.clearRect(0,0,W,H);x.beginPath();
    for(var i=0;i<=head;i+=2){var yy=y(i);i?x.lineTo(i,yy):x.moveTo(i,yy)}
    x.strokeStyle=cs.getPropertyValue('--ink');x.lineWidth=2.6;x.lineJoin='round';x.stroke();
    var hy=y(head);x.fillStyle=cs.getPropertyValue('--sig');
    x.globalAlpha=.25;x.beginPath();x.arc(head,hy,13,0,6.3);x.fill();x.globalAlpha=1;
    x.beginPath();x.arc(head,hy,5.5,0,6.3);x.fill();
  }
  function loop(ts){draw(Math.min(ts-last,50));last=ts;requestAnimationFrame(loop)}
  function set(v){tgt=v==='b'?{sp:170,amp:1.1}:v==='a'?{sp:340,amp:.8}:tgt;if(still){cur={sp:tgt.sp,amp:tgt.amp};draw(0)}}
